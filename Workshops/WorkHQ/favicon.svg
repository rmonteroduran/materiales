<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="layer-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="layer-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="layer-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="8"/>

  <!-- Layer Group Symbol (WorkHQ Orchestration) -->
  <g filter="url(#glow)">
    <!-- Bottom Layer -->
    <path d="M128 320 L256 384 L384 320 L256 256 Z" fill="url(#layer-bot)" opacity="0.85"/>
    
    <!-- Middle Layer -->
    <path d="M128 240 L256 304 L384 240 L256 176 Z" fill="url(#layer-mid)" opacity="0.95"/>
    
    <!-- Top Layer -->
    <path d="M128 160 L256 224 L384 160 L256 96 Z" fill="url(#layer-top)"/>
  </g>
</svg>
