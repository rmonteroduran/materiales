<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="90" height="90" x="5" y="5" rx="24" fill="url(#faviconGrad)" />
  <!-- Cubes / Layers Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M50 25 L75 38 L50 51 L25 38 Z" fill="rgba(255,255,255,0.2)" />
    <path d="M25 50 L50 63 L75 50" />
    <path d="M25 62 L50 75 L75 62" />
  </g>
</svg>
